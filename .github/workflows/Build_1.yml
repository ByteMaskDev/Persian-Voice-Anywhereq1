name: Build Portable EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Pva.App/Pva.App.csproj

      - name: Build portable EXE
        shell: pwsh
        run: ./build/publish-portable.ps1

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: PersianVoiceAnywhere-portable
          path: publish/PersianVoiceAnywhere-portable.zip
          if-no-files-found: error
          retention-days: 7
